# Same baseline settings; enable only the generation input adapter.
# Raw noisy image -> DINOv3+LoRA+MLS[2,5,8,11] -> PgT -> learned RMSNorm.
# Native JiT patch tokens -> separate learned RMSNorm; blend with (t,1-t).
# Frozen iREPA alignment encoder remains DINOv1, independent of generation.
experiment:
  exp_name: rmsnorm2-basejit-irepa-dinov1-B-80-gbs1024
  output_dir: checkpoints/rmsnorm2-basejit-irepa-dinov1-B-80-gbs1024
  resume: ''

data:
  data_path: null
  img_size: 256
  class_num: 1000
  num_workers: 12
  pin_mem: true

model:
  model: JiT-B/16
  attn_dropout: 0.0
  proj_dropout: 0.0
  generation_input_mode: rmsnorm2

generation:
  # Entrypoint resolves PRETRAIN_MODELS_ROOT; CLI --dino_weights overrides it.
  dino_weights: null
  dino_lora_r: 64
  dino_lora_alpha: 64.0
  dino_lora_dropout: 0.0
  dino_train_patch_embed: true

alignment:
  enable_repa: true
  enc_type: dino-vit-b
  encoder_depth: 4
  projector_dim: 2048
  projection_layer_type: conv
  proj_kwargs_kernel_size: 3
  projection_loss_type: cosine
  proj_coeff: '0.5'
  spnorm_method: zscore
  cls_token_weight: 0.2
  zscore_alpha: 0.8
  zscore_proj_skip_std: false

diffusion:
  P_mean: -0.8
  P_std: 0.8
  noise_scale: 1.0
  t_eps: 0.05
  label_drop_prob: 0.1

optimization:
  epochs: 80
  warmup_epochs: 5
  batch_size: 128
  expected_global_batch_size: 1024
  lr: null
  blr: 0.00005
  min_lr: 0.0
  lr_schedule: constant
  weight_decay: 0.0
  ema_decay1: 0.9999
  ema_decay2: 0.9996

checkpointing:
  start_epoch: 0
  save_interval: 10
  save_last_freq: 1

evaluation:
  online_eval: true
  evaluate_gen: false
  eval_freq: 20
  sampling_method: heun
  num_sampling_steps: 50
  cfg: 1.0
  interval_min: 0.0
  interval_max: 1.0
  num_images: 50000
  gen_bsz: 64
  sample_grid: false
  sample_grid_freq: 20
  sample_grid_n_images: 64

logging:
  log_freq: 100
  report_to: tensorboard

runtime:
  device: cuda
  seed: 0
  dist_url: env://
