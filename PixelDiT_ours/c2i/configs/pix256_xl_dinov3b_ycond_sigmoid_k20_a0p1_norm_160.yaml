# PixelDiT-XL + DINOv3-B/16 LoRA + DinoYCond。
# 归一化 sigmoid 保证 f(0)=0、f(1)=1；DINO 输入不做额外归一化。
# 除 DINO 分支和本地 ImageNet 数据适配外，沿用 PixelDiT 默认训练/采样配置。
seed_everything: true
per_run_seed: true
tags:
  exp: &exp pixeldit_ours_xl_dinov3b_ycond_sigmoid_norm_k20_a0p1_bs256
torch_hub_dir: ../pretrain_models/torch_hub
huggingface_cache_dir: null
auto_resume: true
trainer:
  default_root_dir: ./train_logs/
  accelerator: gpu
  strategy: ddp
  devices: 8
  num_nodes: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  logger:
      class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        project: pix_dit_c2i
        name: *exp
  num_sanity_val_steps: 0
  max_steps: 800000
  val_check_interval: 100000
  check_val_every_n_epoch: null
  # 指标每500 step写一次；关闭逐 batch 进度条，避免 train.log 被刷新内容撑大。
  log_every_n_steps: 500
  enable_progress_bar: false
  deterministic: null
  inference_mode: true
  use_distributed_sampler: false
  callbacks:
    - class_path: src.utils.CheckpointHook
      init_args:
        every_n_train_steps: 100000
        save_top_k: -1
        save_last: true
    - class_path: src.utils.SaveImagesHook
      init_args:
         save_dir: val_256_xl
         save_compressed: true
model:
  enable_profiling: true
  profiling_print_freq: 1000
  profiling_warmup_steps: 100
  override_lr_on_resume: null
  override_ema_decay_on_resume: null
  num_classes: 1000
  denoiser:
    class_path: pixdit_core.pixeldit_c2i.PixDiT
    init_args:
        in_channels: 3
        patch_size: 16
        num_groups: 16
        hidden_size: &hidden_dim 1152
        patch_depth: 26
        pixel_depth: 4
        num_classes: 1000
        pixel_hidden_size: 16
        dino_model_name: dinov3_vitb16
        dino_weights: null
        dino_aggregation: mls
        dino_layers: default
        dino_label_cond: true
        dino_lora_rank: 64
        dino_lora_alpha: 64.0
        dino_lora_dropout: 0.0
        dino_lora_target_modules: qkv,proj,fc1,fc2
        dino_train_patch_embed: true
        dino_train_final_norm: false
        dino_generation_final_norm_affine: true
        dino_time_blend_transform: sigmoid
        dino_time_blend_key: 20.0
        dino_time_blend_a: 0.1
  diffusion_trainer:
    class_path: src.diffusion.REPATrainer
    init_args:
      lognorm_t: true
      timeshift: 1.0
      encoder:
        class_path: src.diffusion.DINOv2
      align_layer: 8
      proj_denoiser_dim: *hidden_dim
      proj_hidden_dim: *hidden_dim
      proj_encoder_dim: 768
      scheduler: &scheduler src.diffusion.LinearScheduler
  diffusion_sampler:
    class_path: src.diffusion.FlowDPMSolverSampler
    init_args:
      num_steps: 100
      guidance: 3.25
      timeshift: 1.0
      guidance_interval_min: 0.1
      guidance_interval_max: 1.0
      scheduler: *scheduler
      w_scheduler: src.diffusion.LinearScheduler
      guidance_fn: src.diffusion.simple_guidance_fn
      step_fn: src.diffusion.ode_step_fn
  ema_tracker:
    class_path: src.utils.SimpleEMA
    init_args:
      decay: 0.9999
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      weight_decay: 0.0
data:
  train_dataset:
    class_path: src.data.ImageFolderDataset
    init_args:
      data_dir: /mnt/shared-storage-user/datafactory-share/gushishen/imagenet
      image_size: 256
      random_flip: false
  eval_dataset:
    class_path: src.data.ClassLabelRandomNDataset
    init_args:
      num_classes: 1000
      max_num_instances: 50000
      latent_shape:
        - 3
        - 256
        - 256
  pred_dataset:
    class_path: src.data.ClassLabelRandomNDataset
    init_args:
      num_classes: 1000
      max_num_instances: 50000
      latent_shape:
        - 3
        - 256
        - 256
  train_batch_size: 32
  train_num_workers: 4
  pred_batch_size: 32
  pred_num_workers: 1
