# PixelDiT-B/16: the paper's B architecture and ImageNet-256 recipe, for 80 epochs.
seed_everything: 0
per_run_seed: false
tags:
  exp: PixelDiT-B-80
auto_resume: true
trainer:
  default_root_dir: ./train_logs
  accelerator: gpu
  strategy: ddp
  devices: 4
  num_nodes: 1
  precision: bf16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: ./train_logs
      name: exp_PixelDiT-B-80
      version: metrics
  num_sanity_val_steps: 0
  max_epochs: 80
  max_steps: -1
  check_val_every_n_epoch: 20
  val_check_interval: 1.0
  log_every_n_steps: 50
  inference_mode: true
  use_distributed_sampler: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 100
    - class_path: src.utils.CheckpointHook
      init_args:
        every_n_epochs: 20
        save_top_k: -1
        save_last: false
        save_on_train_epoch_end: true
    - class_path: src.utils.CheckpointHook
      init_args:
        every_n_epochs: 1
        save_top_k: 0
        save_last: true
        save_on_train_epoch_end: true
    - class_path: src.utils.SaveImagesHook
      init_args:
        save_dir: val_256_b
        save_compressed: true
model:
  enable_profiling: true
  profiling_print_freq: 1000
  profiling_warmup_steps: 100
  num_classes: 1000
  denoiser:
    class_path: pixdit_core.pixeldit_c2i.PixDiT
    init_args:
      in_channels: 3
      patch_size: 16
      num_groups: 12
      hidden_size: 768
      patch_depth: 12
      pixel_depth: 2
      num_classes: 1000
      pixel_hidden_size: 16
  diffusion_trainer:
    class_path: src.diffusion.REPATrainer
    init_args:
      lognorm_t: true
      timeshift: 1.0
      null_condition_p: 0.1
      feat_loss_weight: 0.5
      encoder:
        class_path: src.diffusion.DINOv2
        init_args:
          model_name: dinov2_vitb14
          repo_path: ../third_party/dinov2
          weights_path: /data0/pretrain_models/dinov2_vitb14_pretrain.pth
      align_layer: 8
      proj_denoiser_dim: 768
      proj_hidden_dim: 768
      proj_encoder_dim: 768
      scheduler: src.diffusion.LinearScheduler
  diffusion_sampler:
    class_path: src.diffusion.FlowDPMSolverSampler
    init_args:
      num_steps: 100
      guidance: 3.25
      timeshift: 1.0
      guidance_interval_min: 0.1
      guidance_interval_max: 1.0
      scheduler: src.diffusion.LinearScheduler
      w_scheduler: src.diffusion.LinearScheduler
      guidance_fn: src.diffusion.simple_guidance_fn
      step_fn: src.diffusion.ode_step_fn
  ema_tracker:
    class_path: src.utils.SimpleEMA
    init_args:
      decay: 0.9999
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1.0e-4
      betas: [0.9, 0.999]
      weight_decay: 0.0
data:
  train_dataset:
    class_path: src.data.ImageNetFolderDataset
    init_args:
      data_dir: /data0/datasets/imagenet/train
      image_size: 256
  eval_dataset:
    class_path: src.data.ClassLabelRandomNDataset
    init_args:
      num_classes: 1000
      max_num_instances: 50000
      latent_shape: [3, 256, 256]
  pred_dataset:
    class_path: src.data.ClassLabelRandomNDataset
    init_args:
      num_classes: 1000
      max_num_instances: 50000
      latent_shape: [3, 256, 256]
  train_batch_size: 64
  train_num_workers: 8
  train_prefetch_factor: 2
  eval_batch_size: 32
  eval_num_workers: 2
  pred_batch_size: 32
  pred_num_workers: 2
  seed: 0
